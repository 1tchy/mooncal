version: 2
updates:
  - package-ecosystem: "npm"
    directory: "ui"
    schedule:
      interval: "daily"
    target-branch: "develop"
    # Disable all updates except security updates
    ignore:
      # Disable all updates except security updates
      # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#specifying-dependencies-and-versions-to-ignore
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Dev/build-only tooling: suppress security-update PRs too
      # These never run in production, so a fix PR is just noise.
      - dependency-name: "webpack-dev-server"
      - dependency-name: "http-proxy-middleware"
      - dependency-name: "sockjs"
      - dependency-name: "uuid"
      - dependency-name: "esbuild"
      - dependency-name: "vite"
      - dependency-name: "@vitejs/plugin-basic-ssl"
      - dependency-name: "@angular-devkit/build-angular"
      - dependency-name: "@angular-devkit/build-webpack"
      - dependency-name: "@ngtools/webpack"
      - dependency-name: "babel-loader"
      - dependency-name: "@babel/*"
      - dependency-name: "babel-plugin-polyfill-*"
      - dependency-name: "istanbul-lib-instrument"
      - dependency-name: "karma-coverage"
